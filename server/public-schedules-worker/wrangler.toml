name = "hl-scheduler-public-api"
main = "src/worker.mjs"
compatibility_date = "2025-02-01"

# Optional secrets:
#   wrangler secret put PASSWORD_PEPPER
# Required for production:
#   - never store real keys in this file
#   - use Cloudflare Access + ALLOWED_ADMIN_EMAILS for admin worker
[env.public]
name = "hl-scheduler-public-api"

[[env.public.d1_databases]]
binding = "DB"
database_name = "hl-scheduler"
database_id = "a458a8fd-187f-4d19-bdf6-43549ac992a0"

[env.public.vars]
READ_ONLY_MODE = "0"
REQUIRE_ACCESS_EMAIL = "0"
ENABLE_ADMIN_ENDPOINTS = "0"
ALLOWED_ADMIN_EMAILS = "nkh92@hanlim.com"
CORS_ALLOWED_ORIGINS = "https://hl-scheduler-public.pages.dev,https://hl-scheduler-admin.pages.dev"
SHARED_SCHEDULE_ID = ""
ALLOWED_FROM_DOMAIN = "hanlim.com"
SESSION_TTL_HOURS = "12"
SESSION_COOKIE_DOMAIN = "skarhkdgus7.workers.dev"
SESSION_COOKIE_SAME_SITE = "None"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "300"
AUTH_RATE_LIMIT_MAX_ATTEMPTS = "10"

[env.admin]
name = "hl-scheduler-admin-api"

[[env.admin.d1_databases]]
binding = "DB"
database_name = "hl-scheduler"
database_id = "a458a8fd-187f-4d19-bdf6-43549ac992a0"

[env.admin.vars]
READ_ONLY_MODE = "0"
REQUIRE_ACCESS_EMAIL = "1"
ENABLE_ADMIN_ENDPOINTS = "1"
ALLOWED_ADMIN_EMAILS = "nkh92@hanlim.com"
CORS_ALLOWED_ORIGINS = "https://hl-scheduler-public.pages.dev,https://hl-scheduler-admin.pages.dev"
SHARED_SCHEDULE_ID = ""
ALLOWED_FROM_DOMAIN = "hanlim.com"
SESSION_TTL_HOURS = "12"
SESSION_COOKIE_DOMAIN = "skarhkdgus7.workers.dev"
SESSION_COOKIE_SAME_SITE = "None"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "300"
AUTH_RATE_LIMIT_MAX_ATTEMPTS = "10"
