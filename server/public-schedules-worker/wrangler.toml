# Local template only.
# Do not use this file for staging/production deploys.
# CI and manual promotion flows generate environment-specific configs with:
#   node scripts/cloudflare/render-wrangler-config.mjs --surface public
#   node scripts/cloudflare/render-wrangler-config.mjs --surface admin

name = "hl-scheduler-worker-template"
main = "src/worker.mjs"
compatibility_date = "2025-02-01"

[[durable_objects.bindings]]
name = "COLLAB_REALTIME"
class_name = "CollabWorkspaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollabWorkspaceRoom"]

[[d1_databases]]
binding = "DB"
database_name = "replace-me"
database_id = "replace-me"

[vars]
READ_ONLY_MODE = "0"
REQUIRE_ACCESS_EMAIL = "0"
ENABLE_ADMIN_ENDPOINTS = "0"
ALLOWED_ADMIN_EMAILS = "replace-me@example.com"
CORS_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
SHARED_SCHEDULE_ID = ""
ALLOWED_FROM_DOMAIN = "example.com"
SESSION_TTL_HOURS = "12"
SESSION_COOKIE_SAME_SITE = "None"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "300"
AUTH_RATE_LIMIT_MAX_ATTEMPTS = "10"
