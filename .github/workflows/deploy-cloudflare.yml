name: Deploy Cloudflare (Workers + Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy public worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -e public --config server/public-schedules-worker/wrangler.toml

      - name: Deploy admin worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -e admin --config server/public-schedules-worker/wrangler.toml

  deploy-pages:
    runs-on: ubuntu-latest
    needs:
      - deploy-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_APP_ROLE: public
          VITE_PUBLIC_SCHEDULES_API_BASE: https://hl-scheduler-public-api.skarhkdgus7.workers.dev
          VITE_PUBLIC_SCHEDULES_WRITE_API_BASE: https://hl-scheduler-public-api.skarhkdgus7.workers.dev
          VITE_AUTH_API_BASE: https://hl-scheduler-public-api.skarhkdgus7.workers.dev
          VITE_ADMIN_API_BASE: https://hl-scheduler-public-api.skarhkdgus7.workers.dev
          VITE_PUBLIC_APP_URL: https://hl-scheduler-public.pages.dev
          VITE_ADMIN_APP_URL: https://hl-scheduler-public.pages.dev
          VITE_SHARED_SCHEDULE_ID: ""
        run: npm run build

      - name: Deploy pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name hl-scheduler-public --branch main
